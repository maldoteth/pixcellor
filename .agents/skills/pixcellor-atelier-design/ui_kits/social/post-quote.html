<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../colors_and_type.css">
<title>Atelier — Quote post</title>
<style>
  html, body { margin: 0; background: #000; }
  .frame {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(900px 700px at 50% 40%, rgba(95, 184, 201, 0.10), transparent 70%),
      radial-gradient(700px 500px at 80% 90%, rgba(226, 188, 101, 0.10), transparent 65%),
      var(--bg-0);
    color: var(--fg-0);
    font-family: var(--font-sans);
  }
  .nav { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .nav img { height: 28px; }
  .nav-meta { font: var(--t-eyebrow); letter-spacing: var(--track-mega); text-transform: uppercase; color: var(--fg-2); }

  .quote-mark {
    position: absolute;
    top: 200px; left: 64px;
    font: 600 280px/0.6 var(--font-editorial);
    color: transparent;
    background: var(--gold-sheen);
    -webkit-background-clip: text; background-clip: text;
    opacity: 0.85;
    filter: drop-shadow(0 18px 40px rgba(201,155,63,0.18));
  }

  .quote {
    position: absolute;
    top: 360px; left: 64px; right: 64px;
    font: 500 88px/1.05 var(--font-display);
    letter-spacing: -0.025em;
    color: var(--fg-0);
  }
  .quote em {
    font: 500 italic 88px/1.05 var(--font-editorial);
    background: var(--gold-sheen);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .rule {
    position: absolute;
    bottom: 280px; left: 64px;
    width: 120px; height: 1px;
    background: var(--gold-sheen);
  }

  .attr {
    position: absolute;
    bottom: 180px; left: 64px;
    font: 600 22px/1.2 var(--font-sans);
    color: var(--fg-0);
    letter-spacing: -0.01em;
  }
  .attr-sub {
    position: absolute;
    bottom: 140px; left: 64px;
    font: var(--t-eyebrow); letter-spacing: var(--track-mega); text-transform: uppercase;
    color: var(--fg-2);
  }

  .foot {
    position: absolute;
    bottom: 64px; left: 64px; right: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pix { font: 500 14px/1 var(--font-pixel); color: var(--fg-3); letter-spacing: var(--track-wide); }

  .mark-plate {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--silver-brushed);
    border: 1px solid rgba(0,0,0,0.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.5), var(--shadow-2);
    display: flex; align-items: center; justify-content: center;
  }
  .mark-plate img { width: 32px; height: 32px; }
</style>
</head>
<body>
  <div class="frame pixel-sparkle">
    <div class="nav">
      <img src="../../assets/logo-wordmark-white.png" alt="Pixcellor">
      <span class="nav-meta">✦ Studio notes · 014</span>
    </div>

    <div class="quote-mark">“</div>
    <p class="quote">We don't make ads.<br>We make <em>websites</em>.</p>

    <div class="rule"></div>
    <div class="attr">Iyaad — founder, Pixcellor</div>
    <div class="attr-sub">From the studio · 2026</div>

    <div class="foot">
      <span class="pix">PXR ✕ Atelier</span>
      <div class="mark-plate"><img src="../../assets/logo-mark-white.png" alt="P mark"></div>
    </div>
  </div>
</body>
</html>
