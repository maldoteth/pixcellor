<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../colors_and_type.css">
<title>Atelier — Pricing post</title>
<style>
  html, body { margin: 0; background: #000; }
  .frame {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(800px 600px at 50% 38%, rgba(226, 188, 101, 0.22), transparent 60%),
      var(--bg-0);
    color: var(--fg-0);
    font-family: var(--font-sans);
  }
  .nav { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
  .nav img { height: 28px; }
  .nav-meta { font: var(--t-eyebrow); letter-spacing: var(--track-mega); text-transform: uppercase; color: var(--fg-2); }

  .eyebrow {
    position: absolute; top: 220px; left: 50%; transform: translateX(-50%);
    font: var(--t-eyebrow); letter-spacing: var(--track-mega); text-transform: uppercase;
    color: var(--fg-2);
    display: flex; align-items: center; gap: 14px;
  }
  .eyebrow .rule { width: 32px; height: 1px; background: var(--gold-sheen); }

  .rrp {
    position: absolute; top: 296px; left: 50%; transform: translateX(-50%);
    font: 500 36px/1 var(--font-display);
    color: var(--fg-3);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--fg-4);
  }
  .price-block {
    position: absolute; top: 360px; left: 50%; transform: translateX(-50%);
    text-align: center;
  }
  .currency { font: 600 60px/0.9 var(--font-display); color: var(--fg-1); vertical-align: 120px; }
  .num {
    font: 600 360px/0.85 var(--font-display);
    letter-spacing: -0.04em;
    background: var(--gold-conic);
    background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 18px 40px rgba(201, 155, 63, 0.35));
  }
  .qual {
    margin-top: 4px;
    font: 500 22px/1 var(--font-sans);
    color: var(--fg-2);
    letter-spacing: var(--track-wide);
    text-transform: uppercase;
  }

  /* inclusions card */
  .card {
    position: absolute;
    bottom: 200px; left: 64px; right: 64px;
    padding: 36px 44px;
    border-radius: var(--r-3);
    background: var(--glass-bg-hi);
    border: 1px solid var(--glass-border-hi);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inner), var(--shadow-3);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 36px;
  }
  .card h4 {
    grid-column: 1 / -1;
    margin: 0 0 8px;
    font: 600 14px/1 var(--font-sans);
    letter-spacing: var(--track-mega);
    text-transform: uppercase;
    color: var(--fg-2);
    display: flex; align-items: center; gap: 12px;
  }
  .card h4::before { content: "▦"; font-family: var(--font-pixel); color: var(--accent); font-size: 16px; }
  .incl { display: flex; align-items: center; gap: 12px; font: 500 19px/1.2 var(--font-sans); color: var(--fg-1); }
  .incl .tick {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--silver-brushed);
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -1px 0 rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    color: var(--silver-0);
    flex: 0 0 22px;
  }
  .incl .tick svg { width: 12px; height: 12px; }

  .foot {
    position: absolute; bottom: 64px; left: 64px; right: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .note { font: 500 14px/1.3 var(--font-sans); color: var(--fg-3); max-width: 360px; }
  .cta {
    font: 600 18px/1 var(--font-sans);
    padding: 18px 32px;
    border-radius: var(--r-2);
    background: var(--silver-brushed);
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 2px), var(--silver-brushed);
    color: var(--silver-0);
    border: 1px solid rgba(0,0,0,0.5);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.55), var(--shadow-2);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="nav">
      <img src="../../assets/logo-wordmark-white.png" alt="Pixcellor">
      <span class="nav-meta">▦ Full Works · pricing</span>
    </div>

    <div class="eyebrow"><span class="rule"></span> Limited release · ten slots <span class="rule"></span></div>
    <div class="rrp">RRP £2,500</div>

    <div class="price-block">
      <span class="currency">£</span><span class="num">500</span>
      <div class="qual">Turnkey · Lifetime guarantee</div>
    </div>

    <div class="card">
      <h4>What you get</h4>
      <div class="incl"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg></span> 7-day turnaround</div>
      <div class="incl"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg></span> Bespoke design</div>
      <div class="incl"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg></span> SEO + AEO baked in</div>
      <div class="incl"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg></span> Lifetime hosting</div>
      <div class="incl"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg></span> 0.8s page loads</div>
      <div class="incl"><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5L20 7"/></svg></span> Direct studio line</div>
    </div>

    <div class="foot">
      <p class="note">Hand-built in the studio — never outsourced, never templated.</p>
      <button class="cta">Claim a slot →</button>
    </div>
  </div>
</body>
</html>
