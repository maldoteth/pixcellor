<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atelier — Editorial Posts</title>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#0B0B10"/>
  <text x="50" y="48" text-anchor="middle" font-family="serif" font-style="italic"
        font-size="44" font-weight="500"
        fill="url(#g)">Æ</text>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE8B0"/>
      <stop offset="0.5" stop-color="#C99B3F"/>
      <stop offset="1" stop-color="#FBE8B0"/>
    </linearGradient>
  </defs>
</svg>
</template>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Fraunces:ital,wght@1,400;1,500&family=Pixelify+Sans:wght@500;600&family=Geist+Mono:wght@500&display=swap">
<style>
  :root {
    --bg-0: #0B0B10;
    --fg-0: #F4F4F2;
    --fg-1: #DCDCD8;
    --fg-2: #9A9A95;
    --fg-3: #6A6A66;
    --line-1: rgba(244,244,242,0.10);
    --line-2: rgba(244,244,242,0.08);
    --gold-1: #FBE8B0;
    --gold-2: #C99B3F;
    --gold-3: #8E6620;
    --gold-sheen: linear-gradient(135deg,#FBE8B0,#C99B3F 35%,#8E6620 55%,#ECC971 75%,#FBE8B0);
    --p-red:#E84B5A; --p-orange:#ED8A3F; --p-yellow:#E8C46B; --p-lime:#8EC273;
    --p-cyan:#5FB8C9; --p-blue:#5476B8; --p-violet:#8C70B8; --p-magenta:#C26BA0;
    --silver-brushed: linear-gradient(180deg,#2E2D2A 0%,#4A4844 14%,#7A7872 30%,#6E6C66 48%,#888680 64%,#5C5A55 82%,#3A3835 100%);
    --font-sans: "Geist", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-display: "Geist", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-pixel: "Pixelify Sans", ui-monospace, monospace;
    --font-editorial: "Fraunces", "Times New Roman", serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #000;
    color: var(--fg-0); font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .frame {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    background: var(--bg-0);
    page-break-after: always;
    break-after: page;
    margin: 0 auto 40px;
  }
  .head {
    position: absolute; top: 56px; left: 72px; right: 72px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .head img { height: 40px; display: block; }
  .head .meta {
    font: 500 20px/1 var(--font-pixel);
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);
  }
  .foot {
    position: absolute; bottom: 50px; left: 72px; right: 72px;
    display: flex; justify-content: space-between; align-items: center;
    font: 500 20px/1 var(--font-pixel); letter-spacing: 0.08em;
    color: var(--fg-3);
  }
  em.gold {
    font: 500 italic 1em/1 var(--font-editorial);
    font-style: italic;
    background: var(--gold-sheen);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .gold-text {
    background: var(--gold-sheen);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .gold-rule { background: var(--gold-sheen); border-radius: 1px; }
  .pix-row { display: flex; gap: 7px; }
  .pix-row span { display: inline-block; width: 11px; height: 11px; opacity: 0.7; }
  .pix-row .c0 { background: var(--p-red); }
  .pix-row .c1 { background: var(--p-orange); }
  .pix-row .c2 { background: var(--p-yellow); }
  .pix-row .c3 { background: var(--p-lime); }
  .pix-row .c4 { background: var(--p-cyan); }
  .pix-row .c5 { background: var(--p-blue); }
  .pix-row .c6 { background: var(--p-violet); }
  .pix-row .c7 { background: var(--p-magenta); }
</style>
</head>
<body>
<section class="frame">
  <div class="head">
    <img src="../assets/logo-wordmark-white.png" alt="Pixcellor">
    <span class="meta">★ The studio · cadence</span>
  </div>
  <div style="position:absolute; top:198px; left:72px; font:500 25px/1 var(--font-pixel); letter-spacing:0.22em; text-transform:uppercase; color:var(--fg-2);">
    Then &nbsp;·&nbsp; Now
  </div>
  <!-- Then -->
  <div style="position:absolute; top:338px; left:72px; right:72px; padding-bottom:59px; border-bottom:1px solid var(--line-1);">
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:27px;">
      <em style="font:500 italic 54px/1 var(--font-editorial); color:var(--fg-3);">Then</em>
      <span style="font:500 20px/1 var(--font-pixel); letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-3);">2019 · agency era</span>
    </div>
    <div style="font:600 135px/1 var(--font-display); letter-spacing:-0.025em; color:var(--fg-2); margin-top:18px;">
      6 weeks<span style="color:var(--fg-3);"> to launch.</span>
    </div>
    <div style="display:flex; gap:7px; margin-top:32px;">
      <!-- 24 grey blocks -->
      <span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span><span style="flex:1; height:9px; background:rgba(244,244,242,0.10);"></span>
    </div>
  </div>
  <!-- Now -->
  <div style="position:absolute; top:765px; left:72px; right:72px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:27px;">
      <em class="gold" style="font:500 italic 54px/1 var(--font-editorial);">Now</em>
      <span style="font:500 20px/1 var(--font-pixel); letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-2);">2026 · atelier</span>
    </div>
    <div style="font:600 135px/1 var(--font-display); letter-spacing:-0.025em; color:var(--fg-0); margin-top:18px;">
      7 days<span style="color:var(--fg-2);"> to ship.</span>
    </div>
    <!-- spectrum bar 24 cells repeating 8 colors x 3 -->
    <div style="display:flex; gap:7px; margin-top:32px;">
      <span style="flex:1; height:9px; background:var(--p-red); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-orange); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-yellow); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-lime); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-cyan); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-blue); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-violet); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-magenta); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-red); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-orange); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-yellow); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-lime); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-cyan); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-blue); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-violet); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-magenta); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-red); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-orange); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-yellow); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-lime); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-cyan); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-blue); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-violet); opacity:0.85;"></span><span style="flex:1; height:9px; background:var(--p-magenta); opacity:0.85;"></span>
    </div>
  </div>
  <div class="foot"><span>E3 · Then / Now</span><span>✕ 1/9 the time</span></div>
</section>
</body>
</html>
