<style>

  html,body { margin:0; padding:0; background:#08080C; }
  .sframe {

  .s-pad { position:absolute; inset:0; padding:60px 72px; display:flex; flex-direction:column; justify-content:space-between; z-index:2; }
  .s-top { display:flex; justify-content:space-between; align-items:center; }
  .s-wm { height:32px; display:block; }
  .s-cat { font:500 16px/1 var(--font-pixel); letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-3); }
  .s-mid { display:flex; flex-direction:column; gap:0; }
  .s-eyebrow { display:flex; align-items:center; gap:18px; font:500 19px/1 var(--font-pixel); letter-spacing:0.2em; text-transform:uppercase; color:var(--fg-2); margin-bottom:24px; }
  .s-rule { width:54px; height:2px; background:var(--gold-sheen); border-radius:1px; }
  .s-title { margin:0; font:600 72px/1.0 var(--font-sans); letter-spacing:-0.03em; color:var(--fg-0); max-width:1000px; text-wrap:balance; }
  .s-title.lg { font-size:88px; }
  .s-title.sm { font-size:58px; }
  .s-title em { font:500 italic 1em/1 var(--font-editorial); font-style:italic; background:var(--gold-sheen); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .s-sub { margin:22px 0 0; font:400 27px/1.4 var(--font-sans); color:var(--fg-2); max-width:840px; }
  .s-chip { display:inline-flex; align-items:center; gap:10px; margin-top:26px; padding:11px 20px; border-radius:999px; width:fit-content;
    background:var(--gold-conic); color:#1A1208; border:1px solid rgba(142,102,32,0.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.45); font:600 22px/1 var(--font-sans); }
  .s-foot { display:flex; justify-content:space-between; align-items:center; }
  .s-url { font:500 19px/1 var(--font-mono); color:var(--fg-3); letter-spacing:0.02em; }
  .s-pix { display:flex; gap:14px; font:600 20px/1 var(--font-pixel); color:var(--fg-3); }
  .dot { position:absolute; border-radius:1px; z-index:1; }

const SPEC = ["#E84B5A","#ED8A3F","#E8C46B","#8EC273","#5FB8C9","#5476B8","#8C70B8","#C26BA0"];
function dots(accent){
  // 3 ambient whisper pixels — accent + two spectrum, low opacity
  const conf = [
    {l:"86%", t:"30%", c:accent, s:7, o:0.6},
    {l:"92%", t:"58%", c:SPEC[(SPEC.indexOf(accent)+3+8)%8]||"#5FB8C9", s:6, o:0.4},
    {l:"79%", t:"76%", c:SPEC[(SPEC.indexOf(accent)+5+8)%8]||"#C26BA0", s:5, o:0.4},
  ];
  return conf.map(d=>`<span class="dot" style="left:${d.l};top:${d.t};width:${d.s}px;height:${d.s}px;background:${d.c};opacity:${d.o};box-shadow:0 0 18px ${d.c}">`+`</span>`).join("");
}

const sheet = document.getElementById("sheet");
PAGES.forEach(p => {
  const el = document.createElement("section");
  el.className = "sframe";
  el.dataset.file = p.file;
  el.style.setProperty("--accent", p.accent);
  const sizeCls = p.size ? " "+p.size : "";
  el.innerHTML = `
    ${dots(p.accent)}
    <div class="s-pad">
      <div class="s-top">
        <img class="s-wm" src="assets/logo-wordmark-white.png" alt="Pixcellor">
        <span class="s-cat">${p.cat}</span>
      </div>
      <div class="s-mid">
        <div class="s-eyebrow"><span class="s-rule"></span> ${p.eyebrow}</div>
        <h1 class="s-title${sizeCls}">${p.title}</h1>
        <p class="s-sub">${p.sub}</p>
        ${p.chip ? `<span class="s-chip">★ ${p.chip}</span>` : ""}
      </div>
      <div class="s-foot">
        <span class="s-url">${p.url}</span>
        <span class="s-pix">▦&nbsp;&nbsp;✕</span>
      </div>
    </div>`;
  sheet.appendChild(el);
});

// Capture helper: isolate one frame at NATIVE 1200×630, top-left,
// body clamped to exactly the frame size so the capture is pixel-exact.
window.showOnly = function(i){
  const frames = [...document.querySelectorAll(".sframe")];
  frames.forEach((f,j)=>{ f.style.display = (j===i) ? "block" : "none"; });
  const f = frames[i];
  f.style.margin = "0";
  f.style.position = "absolute"; f.style.left="0"; f.style.top="0";
  const s = window.innerWidth / 1200;
  f.style.transformOrigin = "top left";
  f.style.transform = "scale(" + s + ")";
  document.documentElement.style.width = window.innerWidth + "px";
  document.documentElement.style.height = (630*s) + "px";
  document.body.style.width = window.innerWidth + "px";
  document.body.style.height = (630*s) + "px";
  document.body.style.overflow = "hidden";
  document.body.style.background = "#0B0B10";
  window.scrollTo(0,0);
  return frames[i].dataset.file;
};
window.showAll = function(){
  const frames=[...document.querySelectorAll(".sframe")];
  frames.forEach(f=>{ f.style.display="block"; f.style.position="relative"; f.style.transform="none"; f.style.margin="0 auto 28px"; });
  document.body.style.height="auto"; document.body.style.overflow="auto";
};
