<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<title>Logo mark</title>
<style>
  .stage { display: flex; align-items: center; gap: 32px; padding: 12px 6px; }
  .panel { flex: 1; min-height: 130px; border-radius: var(--r-3); display: flex; align-items: center; justify-content: center; position: relative; }
  .panel.dark { background: var(--bg-1); border: 1px solid var(--line-2); }
  .panel.light { background: #F6F4EF; border: 1px solid rgba(22,20,15,0.10); }
  .panel.metal { background: var(--silver-brushed); border: 1px solid rgba(0,0,0,0.4); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); }
  .panel img { width: 56px; height: 56px; }
  .panel-label { position: absolute; bottom: 8px; left: 12px; font: var(--t-code-sm); color: var(--fg-3); }
  .panel.light .panel-label { color: rgba(22,20,15,0.55); }
  .panel.metal .panel-label { color: rgba(244,242,238,0.6); }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Logo · mark</div>
    <div class="stage">
      <div class="panel dark"><img src="../assets/logo-mark-white.png" alt="P mark"><span class="panel-label">on dark</span></div>
      <div class="panel light"><img src="../assets/logo-mark-black.png" alt="P mark"><span class="panel-label">on paper</span></div>
      <div class="panel metal"><img src="../assets/logo-mark-white.png" alt="P mark"><span class="panel-label">on silver plate</span></div>
    </div>
  </div>
</body>
</html>
