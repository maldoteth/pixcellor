<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<title>Mono</title>
<style>
  .code { font: var(--t-code); color: var(--fg-0); }
  .code-sm { font: var(--t-code-sm); color: var(--fg-2); }
  .block { padding: 14px 18px; border-radius: var(--r-2); background: var(--bg-2); border: 1px solid var(--line-2); font: var(--t-code); color: var(--fg-0); }
  .kw { color: var(--accent); }
  .str { color: var(--pix-lime); }
  .com { color: var(--fg-3); }
</style>
</head>
<body>
  <div class="card">
    <div class="spread">
      <span class="tag">Mono · Geist Mono 400–600</span>
      <span class="meta">--t-code / --t-code-sm</span>
    </div>
    <div class="block"><span class="com">// invoice.atelier</span><br><span class="kw">const</span> price = <span class="str">"£500"</span>; <span class="com">// RRP £2,500</span></div>
    <div class="row" style="gap: 24px;">
      <span class="code">PXR-2026-08-14</span>
      <span class="code-sm">order #4821 · 14 Aug</span>
    </div>
  </div>
</body>
</html>
