<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<title>Editorial</title>
<style>
  .ed-line { font: 500 64px/1.0 var(--font-display); color: var(--fg-0); letter-spacing: var(--track-tight); }
  .ed { font: 500 italic 64px/1.0 var(--font-editorial); color: var(--fg-0); letter-spacing: -0.02em; }
  .small-ed { font: 500 italic 28px/1.1 var(--font-editorial); color: var(--gold-text); }
  .note { font: var(--t-body-sm); color: var(--fg-2); }
</style>
</head>
<body>
  <div class="card">
    <div class="spread">
      <span class="tag">Editorial accent · Fraunces italic</span>
      <span class="meta">--font-editorial</span>
    </div>
    <div class="ed-line">We make <span class="ed">websites</span>.</div>
    <div class="row" style="gap: 18px;">
      <span class="small-ed">obsessively</span>
      <span class="small-ed">forever</span>
      <span class="small-ed">turnkey</span>
    </div>
    <p class="note">Use for one emotional word per headline. Never a full sentence.</p>
  </div>
</body>
</html>
