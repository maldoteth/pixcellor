<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<title>Gold</title>
<style>
  .row1 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .sw { aspect-ratio: 1.2/1; border-radius: var(--r-1); border: 1px solid rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .sw .n { font: var(--t-code-sm); color: #16140F; font-weight: 600; }
  .sw .h { font: var(--t-code-sm); color: rgba(22,20,15,0.6); }
  .gold-row { display: flex; align-items: center; gap: 14px; }
  .gold-disc { width: 70px; height: 70px; border-radius: 50%; }
  .gold-pill { padding: 8px 18px; border-radius: var(--r-pill); font: 600 13px/1 var(--font-sans); letter-spacing: var(--track-wide); text-transform: uppercase; }
  .gold-rule { height: 1px; flex: 1; background: var(--gold-sheen); border-radius: 1px; }
  .gold-num { font: 700 56px/1 var(--font-display); letter-spacing: var(--track-tight); }
</style>
</head>
<body>
  <div class="card">
    <div class="spread">
      <span class="tag">Gold · rare jewel accent</span>
      <span class="meta">one per screen, max</span>
    </div>
    <div class="row1">
      <div class="sw" style="background: var(--gold-0)"><div class="n">gold-0</div><div class="h">#FBE8B0</div></div>
      <div class="sw" style="background: var(--gold-1)"><div class="n">gold-1</div><div class="h">#ECC971</div></div>
      <div class="sw" style="background: var(--gold-2)"><div class="n">gold-2</div><div class="h">#C99B3F</div></div>
      <div class="sw" style="background: var(--gold-3)"><div class="n">gold-3</div><div class="h">#8E6620</div></div>
    </div>
    <div class="gold-row">
      <div class="gold-disc gold-shimmer"></div>
      <div class="gold-pill gold-shimmer">★ Elite</div>
      <div class="gold-rule"></div>
      <div class="gold-num gold-text">£500</div>
    </div>
  </div>
</body>
</html>
