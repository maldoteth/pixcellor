<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<title>Badges & chips</title>
<style>
  .b { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-pill); font: 500 11px/1.3 var(--font-sans); letter-spacing: var(--track-wide); text-transform: uppercase; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--fg-1); }
  .b.gold { background: var(--gold-conic); color: var(--accent-on); border-color: rgba(142,102,32,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4); font-weight: 600; }
  .b.silver { background: var(--silver-brushed); color: var(--silver-0); border-color: rgba(0,0,0,0.35); }
  .b.success { color: var(--success); border-color: rgba(142, 194, 115, 0.4); background: rgba(142, 194, 115, 0.08); }
  .b.danger { color: var(--danger); border-color: rgba(232, 75, 90, 0.4); background: rgba(232, 75, 90, 0.08); }
  .b.info { color: var(--info); border-color: rgba(95, 184, 201, 0.4); background: rgba(95, 184, 201, 0.08); }
  .b.pix { font-family: var(--font-pixel); font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Badges · status chips</div>
    <div class="row" style="gap: 8px;">
      <span class="b gold">★ Elite</span>
      <span class="b silver">▦ Studio</span>
      <span class="b success"><span class="dot"></span> Shipped</span>
      <span class="b danger"><span class="dot"></span> Down</span>
      <span class="b info"><span class="dot"></span> Building</span>
      <span class="b">v2.4.0</span>
      <span class="b pix">PXR ✕ 08</span>
    </div>
    <div class="hint">Gold badge is the only place 'Elite' tier shows — reserve carefully.</div>
  </div>
</body>
</html>
