<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<title>Display</title>
<style>
  .display-row { display: flex; flex-direction: column; gap: 6px; }
  .specimen { font: var(--t-display-2); color: var(--fg-0); letter-spacing: var(--track-tight); line-height: 0.92; }
  .specimen-2 { font: var(--t-display-3); color: var(--fg-0); letter-spacing: var(--track-tight); }
  .gradient-num { font: 600 88px/0.95 var(--font-display); letter-spacing: var(--track-tight); }
</style>
</head>
<body>
  <div class="card">
    <div class="spread">
      <span class="tag">Display · Geist 600</span>
      <span class="meta">--t-display-1/2/3</span>
    </div>
    <div class="display-row">
      <div class="specimen">Hand‑built websites.</div>
      <div class="specimen-2">For serious operators.</div>
      <div class="gradient-num"><span class="gold-text">£500</span> <span style="color: var(--fg-3); font-weight: 500;">·</span> <span style="color: var(--fg-3); font: 500 32px/1 var(--font-sans); vertical-align: 18px;">RRP £2,500</span></div>
    </div>
  </div>
</body>
</html>
