<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_card.css">
<title>Headings</title>
<style>
  .h1 { font: var(--t-h1); letter-spacing: var(--track-tight); color: var(--fg-0); }
  .h2 { font: var(--t-h2); letter-spacing: var(--track-tight); color: var(--fg-0); }
  .h3 { font: var(--t-h3); color: var(--fg-0); }

</style>
</head>
<body>
  <div class="card">
    <div class="tag">Headings · Geist 500–600</div>
    <div class="h1">H1 — Premium, without the premium <span class="lbl">48 / 1.05</span></div>
    <div class="h2">H2 — Studio-grade work <span class="lbl">36 / 1.12</span></div>
    <div class="h3">H3 — Section heading example <span class="lbl">24 / 1.25</span></div>
    <div class="h4">H4 — Card title example <span class="lbl">18 / 1.35</span></div>

</html>
